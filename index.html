
<!DOCTYPE html><!DOCTYPE    <title>Meal Prep Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Meal Prep Planner</h1>

<!-- TOP SECTION -->
<div class="container">

    <h2>Add Ingredient</h2>
    <input id="ingredientName" placeholder="Ingredient">

    <select id="ingredientCategory">
        <option>Meat</option>
        <option>Fish</option>
        <option>Veggies</option>
        <option>Fruits</option>
        <option>Dairy</option>
        <option>N/A</option>
    </select>

    <select id="ingredientMacro">
        <option>Protein</option>
        <option>Carbs</option>
        <option>Fiber</option>
        <option>N/A</option>
    </select>

    <button onclick="addIngredient()">Add Ingredient</button>

    <h2>Add Recipe</h2>
    <input id="recipeName" placeholder="Recipe name">
    <input id="recipeIngredients" placeholder="Ingredients (comma separated)">
    
    <select id="recipeType">
        <option value="oven">Oven</option>
        <option value="induction">Induction</option>
    </select>

    <button onclick="addRecipe()">Add Recipe</button>

</div>

<!-- GENERATION SECTION -->
<div class="container">
    <button onclick="generateMealPrep()">🍽 Create Meal Prep</button>
    <div id="output"></div>
</div>

<script src="script.js"></script>

</body>
</html>
